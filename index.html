<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101216">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lift Log</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0A0B0D;
    --panel:#1C2028;
    --panel-2:#242933;
    --border:#3A4150;
    --text:#FFFFFF;
    --text-dim:#B4BAC7;
    --text-faint:#7B8394;
    --accent:#FF6B35;
    --accent-dim:#3A2A22;
    --push:#FF6B35;
    --pull:#4FA3FF;
    --legs:#3DDC84;
    --font-display:'Rockwell','Roboto Slab',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-mono:'SF Mono','Roboto Mono',monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:var(--font-body);
    overscroll-behavior:none;
    user-select:none;
  }
  input{user-select:text;}
  #app{
    max-width:520px; margin:0 auto;
    min-height:100vh;
    display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .screen{ display:none; flex-direction:column; flex:1; }
  .screen.active{ display:flex; }

  header.topbar{
    display:flex; align-items:center; gap:14px;
    padding:calc(env(safe-area-inset-top) + 18px) 20px 16px;
    position:sticky; top:0; background:var(--bg); z-index:10;
  }
  header.topbar .back{
    width:42px; height:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel); border:1.5px solid var(--border);
    color:var(--text); font-size:22px; flex-shrink:0;
  }
  header.topbar .titles{ flex:1; min-width:0; }
  header.topbar h1{
    font-family:var(--font-display); font-weight:700;
    font-size:26px; margin:0; letter-spacing:0.3px;
    color:var(--text);
  }
  header.topbar .sub{
    font-size:13px; color:var(--text-dim); margin-top:2px;
    text-transform:uppercase; letter-spacing:1.2px;
  }

  /* ===== HOME ===== */
  #home{ justify-content:center; padding:24px; gap:18px; position:relative; }
  .corner-backup-link{
    position:absolute; top:calc(env(safe-area-inset-top) + 28px); right:20px;
    background:none; border:none; color:var(--text-faint);
    font-size:12px; font-family:var(--font-body);
    padding:8px; text-decoration:underline;
    z-index:5;
  }
  .home-header{ text-align:center; margin-bottom:10px; }
  .home-icon{
    width:88px; height:88px; object-fit:contain;
    margin-bottom:12px; border-radius:20px;
  }
  .home-header h1{
    font-family:var(--font-display); font-size:40px; margin:0;
    font-weight:700; color:var(--text);
  }
  .day-btn{
    display:flex; align-items:center; gap:18px;
    background:var(--panel);
    border:1px solid var(--border);
    border-left:7px solid var(--c);
    border-radius:18px;
    padding:28px 22px;
    text-align:left;
    color:var(--text);
    font-family:inherit;
    min-height:88px;
  }
  .day-btn .num{
    font-family:var(--font-mono); font-size:15px; color:var(--c);
    font-weight:700;
    width:32px; flex-shrink:0;
  }
  .day-btn .info{ flex:1; min-width:0; }
  .day-btn .name{
    font-family:var(--font-display); font-size:30px; font-weight:700;
    display:block; color:var(--text);
  }
  .day-btn .meta{
    font-size:14px; color:var(--text-dim); margin-top:4px;
  }
  .day-btn .chev{ color:var(--text-faint); font-size:26px; }
  .schedule-note{
    text-align:center; font-size:13px; color:var(--text-faint);
    margin-top:8px; letter-spacing:0.3px;
  }
  .backup-row{
    display:flex; align-items:center; justify-content:center;
    gap:10px; margin-top:16px;
  }
  .backup-link{
    background:none; border:1.5px solid transparent; color:var(--text-faint);
    font-size:13px; font-family:var(--font-body);
    padding:8px 10px; text-decoration:underline;
    border-radius:8px;
  }
  .backup-link.armed{
    color:var(--text); text-decoration:none;
    border-color:var(--border); background:var(--panel-2);
    font-weight:600;
  }
  .backup-sep{ color:var(--text-faint); font-size:13px; }

  /* ===== BACKUP MENU MODAL ===== */
  #backup-overlay{
    position:fixed; inset:0; background:rgba(6,7,9,0.92);
    display:none; align-items:flex-end; z-index:50;
    overflow:hidden;
  }
  #backup-overlay.active{ display:flex; }
  #backup-sheet{
    background:var(--panel); width:100%;
    border-radius:20px 20px 0 0;
    padding:18px 20px calc(28px + env(safe-area-inset-bottom));
    position:relative;
  }
  #backup-sheet h2{
    font-family:var(--font-display); font-size:23px; margin:0 0 6px;
  }
  .backup-sheet-hint{
    font-size:13px; color:var(--text-dim); margin:0;
  }

  /* ===== DAY SCREEN ===== */
  #day-list{ padding:4px 16px 40px; flex:1; overflow-y:auto; }
  .exercise-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    margin-bottom:16px;
    overflow:hidden;
  }
  .exercise-head{
    padding:18px 18px 12px;
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:10px;
  }
  .exercise-name{
    font-size:19px; font-weight:600; line-height:1.3;
  }
  .exercise-target{
    font-size:13px; color:var(--text-dim);
    font-family:var(--font-mono);
    margin-top:4px;
  }
  .exercise-last{
    font-size:13px; color:var(--text-dim);
    white-space:nowrap; text-align:right; flex-shrink:0;
    line-height:1.4;
  }
  .exercise-last b{ color:var(--text); font-weight:700; }
  .sets-grid{
    padding:6px 18px 18px;
    display:flex; flex-direction:column; gap:10px;
  }
  .set-row{
    display:flex; align-items:center; gap:10px;
  }
  .set-label{
    width:24px; font-size:14px; color:var(--text-dim);
    font-family:var(--font-mono); font-weight:700; flex-shrink:0;
  }
  .set-row input{
    flex:1; min-width:0;
    background:var(--panel-2);
    border:1.5px solid var(--border);
    border-radius:11px;
    color:var(--text);
    font-size:19px;
    font-family:var(--font-mono);
    padding:14px 10px;
    text-align:center;
    -webkit-appearance:none;
    min-height:52px;
  }
  .set-row input:focus{ outline:none; border-color:var(--c); border-width:2px; }
  .set-row .x{ color:var(--text-dim); font-size:15px; flex-shrink:0; font-weight:600; }
  .set-row input.reps-input{ flex:1.1; }
  .set-row input.weight-input{ flex:1; }
  .unit-tag{
    font-size:12px; color:var(--text-faint); width:26px; flex-shrink:0;
  }
  .add-set-btn{
    margin-top:4px;
    background:none; border:1.5px dashed var(--border);
    color:var(--text-dim); font-size:14px;
    border-radius:11px; padding:13px; width:100%;
    min-height:48px;
  }
  .card-footer{
    display:flex; border-top:1px solid var(--border);
  }
  .card-footer button{
    flex:1; background:none; border:none; color:var(--text-dim);
    font-size:15px; font-weight:600; padding:16px 8px; font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center; gap:6px;
    min-height:54px;
  }
  .card-footer button:first-child{ border-right:1px solid var(--border); }
  .card-footer button.saved{ color:var(--c); }

  .finish-bar{
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    background:var(--bg);
    border-top:1px solid var(--border);
  }
  .finish-btn{
    width:100%; background:var(--c); color:#0A0B0D;
    border:none; border-radius:16px; padding:20px;
    font-size:18px; font-weight:700; font-family:var(--font-body);
    min-height:60px;
  }

  /* ===== HISTORY MODAL ===== */
  #history-overlay{
    position:fixed; inset:0; background:rgba(6,7,9,0.92);
    display:none; align-items:flex-end; z-index:50;
    overflow:hidden;
  }
  #history-overlay.active{ display:flex; }
  #history-sheet{
    background:var(--panel); width:100%;
    border-radius:20px 20px 0 0;
    max-height:78vh; overflow-y:auto;
    padding:18px 20px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet-handle{
    width:36px; height:4px; background:var(--border);
    border-radius:2px; margin:0 auto 14px;
  }
  #history-sheet h2{
    font-family:var(--font-display); font-size:23px; margin:0 0 6px;
  }
  .history-entry{
    padding:14px 0; border-bottom:1px solid var(--border);
  }
  .history-entry:last-child{ border-bottom:none; }
  .history-date{
    font-size:13px; color:var(--text-dim); text-transform:uppercase;
    letter-spacing:0.8px; font-weight:600;
    margin-bottom:8px; display:block;
  }
  .history-sets{
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .history-chip{
    background:var(--panel-2); border:1.5px solid transparent;
    border-radius:10px;
    padding:7px 12px; font-size:14px; font-family:var(--font-mono);
    color:var(--text);
    display:flex; align-items:center; gap:8px;
    min-height:40px;
  }
  .history-chip .chip-delete{
    background:none; border:none; color:var(--text-faint);
    font-size:14px; font-family:var(--font-body); font-weight:700;
    padding:0 2px; display:none; line-height:1;
  }
  .history-chip.revealed{ border-color:var(--border); }
  .history-chip.revealed .chip-delete{ display:inline-block; }
  .history-chip.confirm{
    background:#FF5252; border-color:#FF5252;
  }
  .history-chip.confirm span, .history-chip.confirm .chip-delete{ color:#0A0B0D; }
  .history-empty{
    color:var(--text-dim); font-size:15px; padding:24px 0; text-align:center;
  }
  .close-sheet{
    position:absolute; top:18px; right:18px;
    width:38px; height:38px; border-radius:50%;
    background:var(--panel-2); border:1.5px solid var(--border);
    color:var(--text-dim); font-size:17px;
  }
  .clear-history-btn{
    width:100%; margin-top:20px;
    background:none; border:1.5px solid var(--border);
    color:#FF5252; font-size:15px; font-weight:600; font-family:var(--font-body);
    border-radius:14px; padding:16px;
    min-height:52px;
  }
  .clear-history-btn.confirm{
    background:#FF5252; border-color:#FF5252; color:#0A0B0D; font-weight:700;
  }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div class="screen active" id="home">
    <button class="corner-backup-link" id="corner-backup-link">Backup</button>
    <div class="home-header">
      <img src="home-icon.png" alt="" class="home-icon">
      <h1>Lift Log</h1>
    </div>
    <button class="day-btn" data-day="push" style="--c:var(--push)">
      <span class="num">01</span>
      <span class="info">
        <span class="name">Push</span>
        <span class="meta" id="meta-push">6 exercises</span>
      </span>
      <span class="chev">&#8250;</span>
    </button>
    <button class="day-btn" data-day="pull" style="--c:var(--pull)">
      <span class="num">02</span>
      <span class="info">
        <span class="name">Pull</span>
        <span class="meta" id="meta-pull">6 exercises</span>
      </span>
      <span class="chev">&#8250;</span>
    </button>
    <button class="day-btn" data-day="legs" style="--c:var(--legs)">
      <span class="num">03</span>
      <span class="info">
        <span class="name">Legs</span>
        <span class="meta" id="meta-legs">5 exercises</span>
      </span>
      <span class="chev">&#8250;</span>
    </button>
    <div class="schedule-note">Push &rarr; Pull &rarr; Legs &rarr; Rest &rarr; Repeat</div>
    <input type="file" id="restore-file-input" accept="application/json" style="display:none">
  </div>

  <!-- BACKUP MENU SHEET -->
  <div id="backup-overlay">
    <div id="backup-sheet">
      <button class="close-sheet" id="close-backup-sheet">&#10005;</button>
      <div class="sheet-handle"></div>
      <h2>Backup &amp; export</h2>
      <p class="backup-sheet-hint">Tap once to select, tap again to confirm.</p>
      <div class="backup-row">
        <button class="backup-link" id="backup-btn">Backup</button>
        <span class="backup-sep">&middot;</span>
        <button class="backup-link" id="restore-btn">Restore</button>
        <span class="backup-sep">&middot;</span>
        <button class="backup-link" id="export-excel-btn">Excel</button>
      </div>
    </div>
  </div>

  <!-- DAY SCREEN -->
  <div class="screen" id="day-screen">
    <header class="topbar">
      <button class="back" id="back-btn">&#8249;</button>
      <div class="titles">
        <h1 id="day-title">Push</h1>
        <div class="sub" id="day-date"></div>
      </div>
    </header>
    <div id="day-list"></div>
    <div class="finish-bar">
      <button class="finish-btn" id="finish-btn">Finish workout</button>
    </div>
  </div>

  <!-- HISTORY SHEET -->
  <div id="history-overlay">
    <div id="history-sheet">
      <button class="close-sheet" id="close-history">&#10005;</button>
      <div class="sheet-handle"></div>
      <h2 id="history-title">History</h2>
      <div id="history-body"></div>
      <button class="clear-history-btn" id="clear-history-btn">Clear history for this exercise</button>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  var ROUTINE = {
    push: {
      color: "var(--push)",
      exercises: [
        { id:"bench_press", name:"Bench press", sets:3, target:"5-8 reps" },
        { id:"incline_db_press", name:"Incline dumbbell press", sets:3, target:"8-12 reps" },
        { id:"seated_shoulder_press", name:"Seated shoulder press", sets:3, target:"8-12 reps" },
        { id:"db_lateral_raise", name:"Dumbbell lateral raises", sets:3, target:"12-20 reps" },
        { id:"triceps_pushdown", name:"Triceps pushdown", sets:3, target:"10-15 reps" },
        { id:"pushups", name:"Push-ups", sets:2, target:"near failure" }
      ]
    },
    pull: {
      color: "var(--pull)",
      exercises: [
        { id:"chinups", name:"Neutral-grip chin-ups", sets:3, target:"6-10 reps" },
        { id:"lat_pulldown", name:"Lat pulldown", sets:3, target:"8-12 reps" },
        { id:"seated_row", name:"Seated cable or machine row", sets:3, target:"8-12 reps" },
        { id:"face_pulls", name:"Face pulls", sets:3, target:"12-20 reps" },
        { id:"db_curls", name:"Dumbbell curls", sets:3, target:"8-12 reps" },
        { id:"reverse_curls", name:"Reverse curls", sets:2, target:"technical failure" }
      ]
    },
    legs: {
      color: "var(--legs)",
      exercises: [
        { id:"leg_press", name:"Leg press or hack squat", sets:3, target:"6-10 reps" },
        { id:"leg_extension", name:"Leg extension", sets:3, target:"10-15 reps" },
        { id:"leg_curl", name:"Seated or lying leg curl", sets:3, target:"10-15 reps" },
        { id:"abs", name:"Abs", sets:3, target:"10-15 reps" },
        { id:"calf_raises", name:"Calf raises", sets:3, target:"technical failure" }
      ]
    }
  };

  var DAY_NAMES = { push:"Push", pull:"Pull", legs:"Legs" };
  var STORAGE_KEY = "liftlog_data_v1";
  var data = loadData();
  var currentDay = null;

  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { history: {} }; // history[exerciseId] = [ {date, sets:[{reps,weight}]} ]
  }

  function saveData(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){}
  }

  function backupData(){
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "lift-log-backup-" + todayStr() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function restoreData(file){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var parsed = JSON.parse(e.target.result);
        if(!parsed || typeof parsed !== "object" || typeof parsed.history !== "object"){
          alert("That file doesn't look like a Lift Log backup.");
          return;
        }
        data = parsed;
        saveData();
        alert("Backup restored.");
        renderHomeMeta();
        showScreen("home");
      }catch(err){
        alert("Couldn't read that file. Make sure it's a Lift Log backup .json file.");
      }
    };
    reader.readAsText(file);
  }

  function exerciseDisplayName(exId){
    for(var day in ROUTINE){
      var found = ROUTINE[day].exercises.find(function(ex){ return ex.id === exId; });
      if(found) return found.name;
    }
    return exId;
  }

  function exportToExcel(){
    if(typeof XLSX === "undefined"){
      alert("Excel export isn't available right now — check your internet connection and try again.");
      return;
    }
    var rows = [];
    Object.keys(data.history).forEach(function(exId){
      var displayName = exerciseDisplayName(exId);
      data.history[exId].forEach(function(session){
        session.sets.forEach(function(set, idx){
          rows.push({
            date: session.date,
            exercise: displayName,
            setNumber: idx + 1,
            reps: set.reps,
            weight: (set.weight === null || set.weight === undefined) ? "" : set.weight
          });
        });
      });
    });

    if(rows.length === 0){
      alert("No logged sets yet — nothing to export.");
      return;
    }

    rows.sort(function(a, b){
      if(a.date !== b.date) return a.date < b.date ? -1 : 1;
      if(a.exercise !== b.exercise) return a.exercise < b.exercise ? -1 : 1;
      return a.setNumber - b.setNumber;
    });

    var sheetData = [["Date", "Exercise", "Set", "Reps", "Weight (lb)"]];
    rows.forEach(function(r){
      sheetData.push([r.date, r.exercise, r.setNumber, r.reps, r.weight]);
    });
    var ws = XLSX.utils.aoa_to_sheet(sheetData);
    ws["!cols"] = [{ wch: 12 }, { wch: 26 }, { wch: 6 }, { wch: 8 }, { wch: 12 }];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Lift Log Data");
    XLSX.writeFile(wb, "lift-log-" + todayStr() + ".xlsx");
  }

  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }

  function formatDateLabel(dateStr){
    var parts = dateStr.split("-");
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return months[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
  }

  function getLastSession(exId){
    var h = data.history[exId];
    if(!h || h.length===0) return null;
    return h[h.length-1];
  }

  function lastSummaryText(exId){
    var last = getLastSession(exId);
    if(!last) return "No history yet";
    var parts = last.sets.map(function(s){
      if(s.weight!==null && s.weight!=="" && s.weight!==undefined){
        return s.reps+"&times;"+s.weight;
      }
      return s.reps+"r";
    });
    return "<b>Last:</b> "+parts.join(", ");
  }

  // ---------- render home meta ----------
  function renderHomeMeta(){
    Object.keys(ROUTINE).forEach(function(day){
      var el = document.getElementById("meta-"+day);
      var n = ROUTINE[day].exercises.length;
      el.textContent = n + " exercises";
    });
  }

  // ---------- day screen ----------
  function openDay(day){
    currentDay = day;
    document.getElementById("day-title").textContent = DAY_NAMES[day];
    document.getElementById("day-date").textContent = formatDateLabel(todayStr());
    document.documentElement.style.setProperty("--c", ROUTINE[day].color);
    var list = document.getElementById("day-list");
    list.innerHTML = "";

    ROUTINE[day].exercises.forEach(function(ex){
      var card = document.createElement("div");
      card.className = "exercise-card";
      card.style.setProperty("--c", ROUTINE[day].color);

      var head = document.createElement("div");
      head.className = "exercise-head";
      head.innerHTML =
        '<div><div class="exercise-name">'+ex.name+'</div>'+
        '<div class="exercise-target">'+ex.sets+' sets &middot; '+ex.target+'</div></div>'+
        '<div class="exercise-last">'+lastSummaryText(ex.id)+'</div>';
      card.appendChild(head);

      var grid = document.createElement("div");
      grid.className = "sets-grid";
      grid.dataset.exId = ex.id;
      grid.dataset.setCount = ex.sets;

      for(var i=1;i<=ex.sets;i++){
        grid.appendChild(makeSetRow(i));
      }
      card.appendChild(grid);

      var addBtn = document.createElement("button");
      addBtn.className = "add-set-btn";
      addBtn.textContent = "+ Add set";
      addBtn.addEventListener("click", function(){
        var currentCount = grid.querySelectorAll(".set-row").length;
        grid.insertBefore(makeSetRow(currentCount+1), addBtn.previousSibling===null?null:null);
        grid.appendChild(makeSetRow(currentCount+1));
        addBtn.remove();
      });
      card.appendChild(addBtn);

      var footer = document.createElement("div");
      footer.className = "card-footer";
      var histBtn = document.createElement("button");
      histBtn.innerHTML = "History";
      histBtn.addEventListener("click", function(){ openHistory(ex.id, ex.name); });
      var saveBtn = document.createElement("button");
      saveBtn.innerHTML = "Log set";
      saveBtn.addEventListener("click", function(){ logExercise(ex.id, grid, saveBtn); });
      footer.appendChild(histBtn);
      footer.appendChild(saveBtn);
      card.appendChild(footer);

      list.appendChild(card);
    });

    showScreen("day-screen");
  }

  function makeSetRow(n){
    var row = document.createElement("div");
    row.className = "set-row";
    row.innerHTML =
      '<span class="set-label">'+n+'</span>'+
      '<input type="number" inputmode="numeric" class="reps-input" placeholder="reps" min="0">'+
      '<span class="x">&times;</span>'+
      '<input type="number" inputmode="decimal" class="weight-input" placeholder="lb" min="0" step="0.5">';
    return row;
  }

  function logExercise(exId, grid, btn){
    var rows = grid.querySelectorAll(".set-row");
    var sets = [];
    rows.forEach(function(row){
      var reps = row.querySelector(".reps-input").value;
      var weight = row.querySelector(".weight-input").value;
      if(reps !== ""){
        sets.push({ reps: Number(reps), weight: weight===""?null:Number(weight) });
      }
    });
    if(sets.length===0){
      btn.textContent = "Enter reps first";
      setTimeout(function(){ btn.textContent="Log set"; }, 1400);
      return;
    }
    if(!data.history[exId]) data.history[exId] = [];
    var today = todayStr();
    var existing = data.history[exId].find(function(s){ return s.date===today; });
    if(existing){
      existing.sets = sets;
    } else {
      data.history[exId].push({ date: today, sets: sets });
    }
    saveData();
    btn.classList.add("saved");
    btn.textContent = "Saved";
    setTimeout(function(){
      btn.classList.remove("saved");
      btn.textContent = "Log set";
    }, 1200);
  }

  // ---------- history sheet ----------
  var currentHistoryExId = null;

  function openHistory(exId, name){
    currentHistoryExId = exId;
    var clearBtn = document.getElementById("clear-history-btn");
    clearBtn.classList.remove("confirm");
    clearBtn.textContent = "Clear history for this exercise";
    document.getElementById("history-title").textContent = name;
    renderHistoryBody(exId);
    document.getElementById("history-overlay").classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function renderHistoryBody(exId){
    var body = document.getElementById("history-body");
    var h = data.history[exId];
    if(!h || h.length===0){
      body.innerHTML = '<div class="history-empty">No sessions logged yet</div>';
    } else {
      var sorted = h.slice().reverse();
      body.innerHTML = sorted.map(function(entry){
        var chips = entry.sets.map(function(s, idx){
          var label = (s.weight!==null) ? (s.reps+" &times; "+s.weight+"lb") : (s.reps+" reps");
          return '<span class="history-chip" data-date="'+entry.date+'" data-set-index="'+idx+'">'+
                 '<span>Set '+(idx+1)+': '+label+'</span>'+
                 '<button type="button" class="chip-delete" aria-label="Delete this set">&#10005;</button>'+
                 '</span>';
        }).join("");
        return '<div class="history-entry" data-date="'+entry.date+'">'+
               '<span class="history-date">'+formatDateLabel(entry.date)+'</span>'+
               '<div class="history-sets">'+chips+'</div></div>';
      }).join("");
    }
  }

  // Single delegated listener on the container — survives every re-render,
  // since we never destroy or re-attach it when innerHTML changes.
  document.getElementById("history-body").addEventListener("click", function(e){
    var body = document.getElementById("history-body");
    var chip = e.target.closest(".history-chip");
    if(!chip) return;

    var chipDeleteBtn = e.target.closest(".chip-delete");

    if(chipDeleteBtn){
      if(!chip.classList.contains("confirm")){
        chip.classList.add("confirm");
        return;
      }
      var date = chip.dataset.date;
      var setIndex = Number(chip.dataset.setIndex);
      if(currentHistoryExId && data.history[currentHistoryExId]){
        var list = data.history[currentHistoryExId];
        var entryObj = list.find(function(en){ return en.date === date; });
        if(entryObj){
          entryObj.sets.splice(setIndex, 1);
          if(entryObj.sets.length === 0){
            data.history[currentHistoryExId] = list.filter(function(en){ return en.date !== date; });
          }
        }
        saveData();
        renderHistoryBody(currentHistoryExId);
        if(currentDay) openDay(currentDay);
      }
      return;
    }

    // Tapped the chip itself (not the x) — toggle reveal
    var wasRevealed = chip.classList.contains("revealed");
    body.querySelectorAll(".history-chip.revealed").forEach(function(c){
      c.classList.remove("revealed");
      c.classList.remove("confirm");
    });
    if(!wasRevealed) chip.classList.add("revealed");
  });

  function closeHistory(){
    document.getElementById("history-overlay").classList.remove("active");
    document.body.style.overflow = "";
  }
  document.getElementById("close-history").addEventListener("click", closeHistory);
  document.getElementById("history-overlay").addEventListener("click", function(e){
    if(e.target.id==="history-overlay") closeHistory();
  });

  document.getElementById("clear-history-btn").addEventListener("click", function(){
    if(!currentHistoryExId) return;
    if(!this.classList.contains("confirm")){
      this.classList.add("confirm");
      this.textContent = "Tap again to confirm";
      return;
    }
    delete data.history[currentHistoryExId];
    saveData();
    this.classList.remove("confirm");
    this.textContent = "Clear history for this exercise";
    renderHistoryBody(currentHistoryExId);
    if(currentDay) openDay(currentDay);
  });


  // ---------- navigation ----------
  function showScreen(id){
    document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
  }

  document.querySelectorAll(".day-btn").forEach(function(btn){
    btn.addEventListener("click", function(){ openDay(btn.dataset.day); });
  });

  document.getElementById("back-btn").addEventListener("click", function(){
    showScreen("home");
  });

  document.getElementById("finish-btn").addEventListener("click", function(){
    // auto-log any filled-in rows that weren't explicitly saved
    var grids = document.querySelectorAll("#day-list .sets-grid");
    grids.forEach(function(grid){
      var exId = grid.dataset.exId;
      var rows = grid.querySelectorAll(".set-row");
      var sets = [];
      rows.forEach(function(row){
        var reps = row.querySelector(".reps-input").value;
        var weight = row.querySelector(".weight-input").value;
        if(reps !== ""){
          sets.push({ reps:Number(reps), weight: weight===""?null:Number(weight) });
        }
      });
      if(sets.length>0){
        if(!data.history[exId]) data.history[exId] = [];
        var today = todayStr();
        var existing = data.history[exId].find(function(s){ return s.date===today; });
        if(existing){ existing.sets = sets; }
        else { data.history[exId].push({ date: today, sets: sets }); }
      }
    });
    saveData();
    showScreen("home");
  });

  // Tap-to-arm, tap-again-to-confirm for Backup/Restore/Excel — first tap
  // just highlights the button, second tap on the SAME button performs the
  // action. Tapping any other button (or elsewhere) disarms without acting.
  function setupArmedButton(btn, onConfirm){
    btn.addEventListener("click", function(e){
      var wasArmed = btn.classList.contains("armed");
      document.querySelectorAll(".backup-link.armed").forEach(function(b){
        b.classList.remove("armed");
      });
      if(wasArmed){
        onConfirm(e);
      } else {
        btn.classList.add("armed");
      }
    });
  }

  setupArmedButton(document.getElementById("backup-btn"), function(){
    backupData();
  });

  setupArmedButton(document.getElementById("restore-btn"), function(){
    document.getElementById("restore-file-input").click();
  });

  document.getElementById("restore-file-input").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    if(confirm("This will replace your current history with the backup file. Continue?")){
      restoreData(file);
    }
    e.target.value = "";
  });

  setupArmedButton(document.getElementById("export-excel-btn"), function(){
    exportToExcel();
  });

  function openBackupSheet(){
    document.getElementById("backup-overlay").classList.add("active");
    document.body.style.overflow = "hidden";
  }
  function closeBackupSheet(){
    document.getElementById("backup-overlay").classList.remove("active");
    document.body.style.overflow = "";
    document.querySelectorAll(".backup-link.armed").forEach(function(b){
      b.classList.remove("armed");
    });
  }
  document.getElementById("corner-backup-link").addEventListener("click", openBackupSheet);
  document.getElementById("close-backup-sheet").addEventListener("click", closeBackupSheet);
  document.getElementById("backup-overlay").addEventListener("click", function(e){
    if(e.target.id === "backup-overlay") closeBackupSheet();
  });

  renderHomeMeta();

})();
</script>
</body>
</html>

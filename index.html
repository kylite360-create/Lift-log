<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#14161A">
<title>Lift Log</title>
<style>
  :root{
    --bg:#101216;
    --panel:#1A1D23;
    --panel-2:#20242B;
    --border:#2A2F38;
    --text:#EDEEF0;
    --text-dim:#8A8F99;
    --text-faint:#5A606B;
    --accent:#E8542A;
    --accent-dim:#3A2A22;
    --push:#E8542A;
    --pull:#3D8BE8;
    --legs:#3CB878;
    --font-display:'Rockwell','Roboto Slab',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-mono:'SF Mono','Roboto Mono',monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:var(--font-body);
    overscroll-behavior:none;
    user-select:none;
  }
  input{user-select:text;}
  #app{
    max-width:520px; margin:0 auto;
    min-height:100vh;
    display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .screen{ display:none; flex-direction:column; flex:1; }
  .screen.active{ display:flex; }

  header.topbar{
    display:flex; align-items:center; gap:12px;
    padding:calc(env(safe-area-inset-top) + 18px) 20px 14px;
    position:sticky; top:0; background:var(--bg); z-index:10;
  }
  header.topbar .back{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel); border:1px solid var(--border);
    color:var(--text); font-size:18px; flex-shrink:0;
  }
  header.topbar .titles{ flex:1; min-width:0; }
  header.topbar h1{
    font-family:var(--font-display); font-weight:700;
    font-size:22px; margin:0; letter-spacing:0.3px;
    color:var(--text);
  }
  header.topbar .sub{
    font-size:12px; color:var(--text-dim); margin-top:2px;
    text-transform:uppercase; letter-spacing:1.2px;
  }

  /* ===== HOME ===== */
  #home{ justify-content:center; padding:24px; gap:16px; }
  .home-header{ text-align:center; margin-bottom:8px; }
  .home-header .kicker{
    font-size:12px; letter-spacing:2px; color:var(--text-faint);
    text-transform:uppercase; margin-bottom:6px;
  }
  .home-header h1{
    font-family:var(--font-display); font-size:34px; margin:0;
    font-weight:700; color:var(--text);
  }
  .day-btn{
    display:flex; align-items:center; gap:16px;
    background:var(--panel);
    border:1px solid var(--border);
    border-left:5px solid var(--c);
    border-radius:16px;
    padding:22px 20px;
    text-align:left;
    color:var(--text);
    font-family:inherit;
  }
  .day-btn .num{
    font-family:var(--font-mono); font-size:13px; color:var(--c);
    width:28px; flex-shrink:0;
  }
  .day-btn .info{ flex:1; min-width:0; }
  .day-btn .name{
    font-family:var(--font-display); font-size:24px; font-weight:700;
    display:block; color:var(--text);
  }
  .day-btn .meta{
    font-size:12px; color:var(--text-dim); margin-top:3px;
  }
  .day-btn .chev{ color:var(--text-faint); font-size:20px; }
  .schedule-note{
    text-align:center; font-size:12px; color:var(--text-faint);
    margin-top:6px; letter-spacing:0.3px;
  }

  /* ===== DAY SCREEN ===== */
  #day-list{ padding:4px 16px 40px; flex:1; overflow-y:auto; }
  .exercise-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .exercise-head{
    padding:14px 16px 10px;
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:10px;
  }
  .exercise-name{
    font-size:16px; font-weight:600; line-height:1.3;
  }
  .exercise-target{
    font-size:11px; color:var(--text-dim);
    font-family:var(--font-mono);
    margin-top:3px;
  }
  .exercise-last{
    font-size:11px; color:var(--text-faint);
    white-space:nowrap; text-align:right; flex-shrink:0;
    line-height:1.4;
  }
  .exercise-last b{ color:var(--text-dim); font-weight:600; }
  .sets-grid{
    padding:4px 16px 16px;
    display:flex; flex-direction:column; gap:8px;
  }
  .set-row{
    display:flex; align-items:center; gap:8px;
  }
  .set-label{
    width:20px; font-size:12px; color:var(--text-faint);
    font-family:var(--font-mono); flex-shrink:0;
  }
  .set-row input{
    flex:1; min-width:0;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:9px;
    color:var(--text);
    font-size:16px;
    font-family:var(--font-mono);
    padding:9px 8px;
    text-align:center;
    -webkit-appearance:none;
  }
  .set-row input:focus{ outline:none; border-color:var(--c); }
  .set-row .x{ color:var(--text-faint); font-size:13px; flex-shrink:0; }
  .set-row input.reps-input{ flex:1.1; }
  .set-row input.weight-input{ flex:1; }
  .unit-tag{
    font-size:10px; color:var(--text-faint); width:26px; flex-shrink:0;
  }
  .add-set-btn{
    margin-top:2px;
    background:none; border:1px dashed var(--border);
    color:var(--text-dim); font-size:12px;
    border-radius:9px; padding:8px; width:100%;
  }
  .card-footer{
    display:flex; border-top:1px solid var(--border);
  }
  .card-footer button{
    flex:1; background:none; border:none; color:var(--text-dim);
    font-size:12px; padding:11px 8px; font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .card-footer button:first-child{ border-right:1px solid var(--border); }
  .card-footer button.saved{ color:var(--c); }

  .finish-bar{
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:var(--bg);
    border-top:1px solid var(--border);
  }
  .finish-btn{
    width:100%; background:var(--c); color:#101216;
    border:none; border-radius:14px; padding:16px;
    font-size:16px; font-weight:700; font-family:var(--font-body);
  }

  /* ===== HISTORY MODAL ===== */
  #history-overlay{
    position:absolute; inset:0; background:rgba(10,11,13,0.75);
    display:none; align-items:flex-end; z-index:50;
  }
  #history-overlay.active{ display:flex; }
  #history-sheet{
    background:var(--panel); width:100%;
    border-radius:20px 20px 0 0;
    max-height:78vh; overflow-y:auto;
    padding:18px 20px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet-handle{
    width:36px; height:4px; background:var(--border);
    border-radius:2px; margin:0 auto 14px;
  }
  #history-sheet h2{
    font-family:var(--font-display); font-size:19px; margin:0 0 4px;
  }
  .history-entry{
    padding:12px 0; border-bottom:1px solid var(--border);
  }
  .history-entry:last-child{ border-bottom:none; }
  .history-date{
    font-size:11px; color:var(--text-faint); text-transform:uppercase;
    letter-spacing:0.8px; margin-bottom:6px;
  }
  .history-sets{
    display:flex; flex-wrap:wrap; gap:6px;
  }
  .history-chip{
    background:var(--panel-2); border-radius:8px;
    padding:5px 10px; font-size:12px; font-family:var(--font-mono);
    color:var(--text);
  }
  .history-empty{
    color:var(--text-dim); font-size:13px; padding:20px 0; text-align:center;
  }
  .close-sheet{
    position:absolute; top:16px; right:16px;
    width:30px; height:30px; border-radius:50%;
    background:var(--panel-2); border:1px solid var(--border);
    color:var(--text-dim); font-size:15px;
  }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div class="screen active" id="home">
    <div class="home-header">
      <div class="kicker">Today's session</div>
      <h1>Lift Log</h1>
    </div>
    <button class="day-btn" data-day="push" style="--c:var(--push)">
      <span class="num">01</span>
      <span class="info">
        <span class="name">Push</span>
        <span class="meta" id="meta-push">6 exercises</span>
      </span>
      <span class="chev">&#8250;</span>
    </button>
    <button class="day-btn" data-day="pull" style="--c:var(--pull)">
      <span class="num">02</span>
      <span class="info">
        <span class="name">Pull</span>
        <span class="meta" id="meta-pull">6 exercises</span>
      </span>
      <span class="chev">&#8250;</span>
    </button>
    <button class="day-btn" data-day="legs" style="--c:var(--legs)">
      <span class="num">03</span>
      <span class="info">
        <span class="name">Legs</span>
        <span class="meta" id="meta-legs">5 exercises</span>
      </span>
      <span class="chev">&#8250;</span>
    </button>
    <div class="schedule-note">Push &rarr; Pull &rarr; Legs &rarr; Rest &rarr; Repeat</div>
  </div>

  <!-- DAY SCREEN -->
  <div class="screen" id="day-screen">
    <header class="topbar">
      <button class="back" id="back-btn">&#8249;</button>
      <div class="titles">
        <h1 id="day-title">Push</h1>
        <div class="sub" id="day-date"></div>
      </div>
    </header>
    <div id="day-list"></div>
    <div class="finish-bar">
      <button class="finish-btn" id="finish-btn">Finish workout</button>
    </div>
  </div>

  <!-- HISTORY SHEET -->
  <div id="history-overlay">
    <div id="history-sheet">
      <button class="close-sheet" id="close-history">&#10005;</button>
      <div class="sheet-handle"></div>
      <h2 id="history-title">History</h2>
      <div id="history-body"></div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  var ROUTINE = {
    push: {
      color: "var(--push)",
      exercises: [
        { id:"bench_press", name:"Bench press", sets:3, target:"5-8 reps" },
        { id:"incline_db_press", name:"Incline dumbbell press", sets:3, target:"8-12 reps" },
        { id:"seated_shoulder_press", name:"Seated shoulder press", sets:3, target:"8-12 reps" },
        { id:"db_lateral_raise", name:"Dumbbell lateral raises", sets:3, target:"12-20 reps" },
        { id:"triceps_pushdown", name:"Triceps pushdown", sets:3, target:"10-15 reps" },
        { id:"pushups", name:"Push-ups", sets:2, target:"near failure" }
      ]
    },
    pull: {
      color: "var(--pull)",
      exercises: [
        { id:"chinups", name:"Neutral-grip chin-ups", sets:3, target:"6-10 reps" },
        { id:"lat_pulldown", name:"Lat pulldown", sets:3, target:"8-12 reps" },
        { id:"seated_row", name:"Seated cable or machine row", sets:3, target:"8-12 reps" },
        { id:"face_pulls", name:"Face pulls", sets:3, target:"12-20 reps" },
        { id:"db_curls", name:"Dumbbell curls", sets:3, target:"8-12 reps" },
        { id:"reverse_curls", name:"Reverse curls", sets:2, target:"technical failure" }
      ]
    },
    legs: {
      color: "var(--legs)",
      exercises: [
        { id:"leg_press", name:"Leg press or hack squat", sets:3, target:"6-10 reps" },
        { id:"leg_extension", name:"Leg extension", sets:3, target:"10-15 reps" },
        { id:"leg_curl", name:"Seated or lying leg curl", sets:3, target:"10-15 reps" },
        { id:"abs", name:"Abs", sets:3, target:"10-15 reps" },
        { id:"calf_raises", name:"Calf raises", sets:3, target:"technical failure" }
      ]
    }
  };

  var DAY_NAMES = { push:"Push", pull:"Pull", legs:"Legs" };
  var STORAGE_KEY = "liftlog_data_v1";
  var data = loadData();
  var currentDay = null;

  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { history: {} }; // history[exerciseId] = [ {date, sets:[{reps,weight}]} ]
  }

  function saveData(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){}
  }

  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }

  function formatDateLabel(dateStr){
    var parts = dateStr.split("-");
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return months[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
  }

  function getLastSession(exId){
    var h = data.history[exId];
    if(!h || h.length===0) return null;
    return h[h.length-1];
  }

  function lastSummaryText(exId){
    var last = getLastSession(exId);
    if(!last) return "No history yet";
    var parts = last.sets.map(function(s){
      if(s.weight!==null && s.weight!=="" && s.weight!==undefined){
        return s.reps+"&times;"+s.weight;
      }
      return s.reps+"r";
    });
    return "<b>Last:</b> "+parts.join(", ");
  }

  // ---------- render home meta ----------
  function renderHomeMeta(){
    Object.keys(ROUTINE).forEach(function(day){
      var el = document.getElementById("meta-"+day);
      var n = ROUTINE[day].exercises.length;
      el.textContent = n + " exercises";
    });
  }

  // ---------- day screen ----------
  function openDay(day){
    currentDay = day;
    document.getElementById("day-title").textContent = DAY_NAMES[day];
    document.getElementById("day-date").textContent = formatDateLabel(todayStr());
    document.documentElement.style.setProperty("--c", ROUTINE[day].color);
    var list = document.getElementById("day-list");
    list.innerHTML = "";

    ROUTINE[day].exercises.forEach(function(ex){
      var card = document.createElement("div");
      card.className = "exercise-card";
      card.style.setProperty("--c", ROUTINE[day].color);

      var head = document.createElement("div");
      head.className = "exercise-head";
      head.innerHTML =
        '<div><div class="exercise-name">'+ex.name+'</div>'+
        '<div class="exercise-target">'+ex.sets+' sets &middot; '+ex.target+'</div></div>'+
        '<div class="exercise-last">'+lastSummaryText(ex.id)+'</div>';
      card.appendChild(head);

      var grid = document.createElement("div");
      grid.className = "sets-grid";
      grid.dataset.exId = ex.id;
      grid.dataset.setCount = ex.sets;

      for(var i=1;i<=ex.sets;i++){
        grid.appendChild(makeSetRow(i));
      }
      card.appendChild(grid);

      var addBtn = document.createElement("button");
      addBtn.className = "add-set-btn";
      addBtn.textContent = "+ Add set";
      addBtn.addEventListener("click", function(){
        var currentCount = grid.querySelectorAll(".set-row").length;
        grid.insertBefore(makeSetRow(currentCount+1), addBtn.previousSibling===null?null:null);
        grid.appendChild(makeSetRow(currentCount+1));
        addBtn.remove();
      });
      card.appendChild(addBtn);

      var footer = document.createElement("div");
      footer.className = "card-footer";
      var histBtn = document.createElement("button");
      histBtn.innerHTML = "History";
      histBtn.addEventListener("click", function(){ openHistory(ex.id, ex.name); });
      var saveBtn = document.createElement("button");
      saveBtn.innerHTML = "Log set";
      saveBtn.addEventListener("click", function(){ logExercise(ex.id, grid, saveBtn); });
      footer.appendChild(histBtn);
      footer.appendChild(saveBtn);
      card.appendChild(footer);

      list.appendChild(card);
    });

    showScreen("day-screen");
  }

  function makeSetRow(n){
    var row = document.createElement("div");
    row.className = "set-row";
    row.innerHTML =
      '<span class="set-label">'+n+'</span>'+
      '<input type="number" inputmode="numeric" class="reps-input" placeholder="reps" min="0">'+
      '<span class="x">&times;</span>'+
      '<input type="number" inputmode="decimal" class="weight-input" placeholder="lb" min="0" step="0.5">';
    return row;
  }

  function logExercise(exId, grid, btn){
    var rows = grid.querySelectorAll(".set-row");
    var sets = [];
    rows.forEach(function(row){
      var reps = row.querySelector(".reps-input").value;
      var weight = row.querySelector(".weight-input").value;
      if(reps !== ""){
        sets.push({ reps: Number(reps), weight: weight===""?null:Number(weight) });
      }
    });
    if(sets.length===0){
      btn.textContent = "Enter reps first";
      setTimeout(function(){ btn.textContent="Log set"; }, 1400);
      return;
    }
    if(!data.history[exId]) data.history[exId] = [];
    var today = todayStr();
    var existing = data.history[exId].find(function(s){ return s.date===today; });
    if(existing){
      existing.sets = sets;
    } else {
      data.history[exId].push({ date: today, sets: sets });
    }
    saveData();
    btn.classList.add("saved");
    btn.textContent = "Saved";
    setTimeout(function(){
      btn.classList.remove("saved");
      btn.textContent = "Log set";
    }, 1200);
  }

  // ---------- history sheet ----------
  function openHistory(exId, name){
    document.getElementById("history-title").textContent = name;
    var body = document.getElementById("history-body");
    var h = data.history[exId];
    if(!h || h.length===0){
      body.innerHTML = '<div class="history-empty">No sessions logged yet</div>';
    } else {
      var sorted = h.slice().reverse();
      body.innerHTML = sorted.map(function(entry){
        var chips = entry.sets.map(function(s, idx){
          var label = (s.weight!==null) ? (s.reps+" &times; "+s.weight+"lb") : (s.reps+" reps");
          return '<span class="history-chip">Set '+(idx+1)+': '+label+'</span>';
        }).join("");
        return '<div class="history-entry"><div class="history-date">'+formatDateLabel(entry.date)+'</div>'+
               '<div class="history-sets">'+chips+'</div></div>';
      }).join("");
    }
    document.getElementById("history-overlay").classList.add("active");
  }

  document.getElementById("close-history").addEventListener("click", function(){
    document.getElementById("history-overlay").classList.remove("active");
  });
  document.getElementById("history-overlay").addEventListener("click", function(e){
    if(e.target.id==="history-overlay") e.currentTarget.classList.remove("active");
  });

  // ---------- navigation ----------
  function showScreen(id){
    document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
  }

  document.querySelectorAll(".day-btn").forEach(function(btn){
    btn.addEventListener("click", function(){ openDay(btn.dataset.day); });
  });

  document.getElementById("back-btn").addEventListener("click", function(){
    showScreen("home");
  });

  document.getElementById("finish-btn").addEventListener("click", function(){
    // auto-log any filled-in rows that weren't explicitly saved
    var grids = document.querySelectorAll("#day-list .sets-grid");
    grids.forEach(function(grid){
      var exId = grid.dataset.exId;
      var rows = grid.querySelectorAll(".set-row");
      var sets = [];
      rows.forEach(function(row){
        var reps = row.querySelector(".reps-input").value;
        var weight = row.querySelector(".weight-input").value;
        if(reps !== ""){
          sets.push({ reps:Number(reps), weight: weight===""?null:Number(weight) });
        }
      });
      if(sets.length>0){
        if(!data.history[exId]) data.history[exId] = [];
        var today = todayStr();
        var existing = data.history[exId].find(function(s){ return s.date===today; });
        if(existing){ existing.sets = sets; }
        else { data.history[exId].push({ date: today, sets: sets }); }
      }
    });
    saveData();
    showScreen("home");
  });

  renderHomeMeta();

})();
</script>
</body>
</html>
